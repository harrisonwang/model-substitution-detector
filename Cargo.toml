[package]
name = "msd"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "Detect model substitution through local AI clients"
repository = "https://github.com/harrisonwang/model-substitution-detector"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
